name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: unzip -q KanboAI.zip
      - run: git clone --depth 1 https://github.com/ggml-org/llama.cpp KanboAI/app/src/main/cpp/llama.cpp
      - run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - working-directory: KanboAI
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KanboAI-apk
          path: KanboAI/app/build/outputs/apk/debug/*.apk
